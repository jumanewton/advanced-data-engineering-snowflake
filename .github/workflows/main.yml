name: Deploy Templatized Data Environment

on:
  pull_request:
    types: [closed]
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main

jobs:
  deploy_data_environment:
    # Only run when PR is merged or on direct push to environment branches
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    env:
      # Override data_eng_snowie connection fields via Snowflake CLI env var mechanism:
      # SNOWFLAKE_CONNECTIONS_<CONNECTION_NAME>_<FIELD> takes precedence over config.toml
      SNOWFLAKE_CONNECTIONS_DATA_ENG_SNOWIE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_CONNECTIONS_DATA_ENG_SNOWIE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_CONNECTIONS_DATA_ENG_SNOWIE_AUTHENTICATOR: SNOWFLAKE_JWT
      SNOWFLAKE_CONNECTIONS_DATA_ENG_SNOWIE_PRIVATE_KEY_PATH: /tmp/rsa_key.p8
      SNOWFLAKE_CONNECTIONS_DATA_ENG_SNOWIE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_CONNECTIONS_DATA_ENG_SNOWIE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_CONNECTIONS_DATA_ENG_SNOWIE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_CONNECTIONS_DATA_ENG_SNOWIE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

    steps:
      # Checkout step is necessary to access repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Write the RSA private key from secrets to a temp file
      # Path must match SNOWFLAKE_CONNECTIONS_DATA_ENG_SNOWIE_PRIVATE_KEY_PATH above
      - name: Set up Snowflake private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8

      # Determine environment based on target branch
      - name: Set environment
        id: set_env
        run: |
          TARGET_BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF#refs/heads/}}"
          
          if [[ $TARGET_BRANCH == "staging" ]]; then
            echo "DEPLOY_ENV=staging" >> $GITHUB_ENV
            echo "Environment set to staging"
          elif [[ $TARGET_BRANCH == "main" ]]; then
            echo "DEPLOY_ENV=prod" >> $GITHUB_ENV
            echo "Environment set to production"
          else
            echo "Unexpected branch: $TARGET_BRANCH"
            exit 1
          fi

      # Install Snowflake CLI GitHub Action and point to config file
      - name: Install SnowflakeCLI
        uses: snowflakedb/snowflake-cli-action@v1.5
        with:
          cli-version: "latest"
          default-config-file-path: "config.toml"

      # Fetch latest changes from the repository to Snowflake
      - name: Fetch latest changes to Snowflake
        run: snow git fetch course_repo.public.advanced_data_engineering_snowflake

      # Deploy templates to the data environment -
      - name: Deploy templates to data environment
        run: |
          # Export TARGET_BRANCH for use in this step
          echo "Using branch: ${GITHUB_REF_NAME}"
          snow git execute @advanced_data_engineering_snowflake/branches/${GITHUB_REF_NAME}/module-1/hamburg_weather/pipeline/data/ \
          -D "env='${{ env.DEPLOY_ENV }}'" \
          --database=COURSE_REPO \
          --schema=PUBLIC
